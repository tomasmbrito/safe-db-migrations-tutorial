<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#0f172a">Renaming a column without downtime: expand / contract</text>
  <text x="30" y="66" font-size="14" fill="#475569">Every arrow is a separate deploy. At every moment, all running app versions work with the schema.</text>

  <g>
    <rect x="30" y="90" width="210" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="135" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">0. Before</text>
    <text x="50" y="160" font-size="13" font-weight="bold" fill="#78350f">schema</text>
    <rect x="50" y="170" width="170" height="30" rx="6" fill="#fef3c7"/><text x="62" y="190" font-size="13" fill="#78350f">name</text>
    <text x="50" y="290" font-size="13" font-weight="bold" fill="#334155">running apps</text>
    <rect x="50" y="300" width="170" height="30" rx="6" fill="#dbeafe"/><text x="62" y="320" font-size="13" fill="#1e3a8a">v1 (name)</text>
  </g>
  <g>
    <rect x="270" y="90" width="210" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="375" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">1. Expand</text>
    <text x="290" y="160" font-size="13" font-weight="bold" fill="#78350f">schema</text>
    <rect x="290" y="170" width="170" height="30" rx="6" fill="#fef3c7"/><text x="302" y="190" font-size="13" fill="#78350f">name</text>
    <rect x="290" y="205" width="170" height="30" rx="6" fill="#fde68a"/><text x="302" y="225" font-size="13" fill="#78350f">full_name (new)</text>
    <text x="290" y="290" font-size="13" font-weight="bold" fill="#334155">running apps</text>
    <rect x="290" y="300" width="170" height="30" rx="6" fill="#dbeafe"/><text x="302" y="320" font-size="13" fill="#1e3a8a">v1 (name)</text>
    <text x="290" y="365" font-size="12" fill="#475569">+ trigger keeps the two</text>
    <text x="290" y="382" font-size="12" fill="#475569">columns in sync</text>
  </g>
  <g>
    <rect x="510" y="90" width="210" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="615" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">2. Migrate</text>
    <text x="530" y="160" font-size="13" font-weight="bold" fill="#78350f">schema</text>
    <rect x="530" y="170" width="170" height="30" rx="6" fill="#fef3c7"/><text x="542" y="190" font-size="13" fill="#78350f">name</text>
    <rect x="530" y="205" width="170" height="30" rx="6" fill="#fde68a"/><text x="542" y="225" font-size="13" fill="#78350f">full_name (filled)</text>
    <text x="530" y="290" font-size="13" font-weight="bold" fill="#334155">running apps</text>
    <rect x="530" y="300" width="170" height="30" rx="6" fill="#dbeafe"/><text x="542" y="320" font-size="13" fill="#1e3a8a">v1 (name)</text>
    <rect x="530" y="335" width="170" height="30" rx="6" fill="#dcfce7"/><text x="542" y="355" font-size="13" fill="#14532d">v2 (full_name)</text>
    <text x="530" y="395" font-size="12" fill="#475569">rolling deploy: both live</text>
  </g>
  <g>
    <rect x="750" y="90" width="220" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="860" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">3. Contract</text>
    <text x="770" y="160" font-size="13" font-weight="bold" fill="#78350f">schema</text>
    <rect x="770" y="170" width="180" height="30" rx="6" fill="#fde68a"/><text x="782" y="190" font-size="13" fill="#78350f">full_name</text>
    <text x="770" y="290" font-size="13" font-weight="bold" fill="#334155">running apps</text>
    <rect x="770" y="300" width="180" height="30" rx="6" fill="#dcfce7"/><text x="782" y="320" font-size="13" fill="#14532d">v2 (full_name)</text>
    <text x="770" y="365" font-size="12" fill="#475569">old column and trigger are</text>
    <text x="770" y="382" font-size="12" fill="#475569">dropped only after v1 is gone</text>
  </g>
  <line x1="240" y1="440" x2="266" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="440" x2="506" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="440" x2="746" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="253" y="462" font-size="11" text-anchor="middle" fill="#475569">migration</text>
  <text x="493" y="462" font-size="11" text-anchor="middle" fill="#475569">deploy v2</text>
  <text x="733" y="462" font-size="11" text-anchor="middle" fill="#475569">stop v1</text>
</svg>
