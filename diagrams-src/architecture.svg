<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#0f172a">What runs in this tutorial</text>

  <!-- runtime lane -->
  <rect x="20" y="62" width="960" height="250" rx="12" fill="#f1f5f9"/>
  <text x="38" y="88" font-size="14" font-weight="bold" fill="#475569">RUNTIME: what users hit</text>

  <rect x="40" y="140" width="150" height="90" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="176" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Users</text>
  <text x="115" y="198" font-size="12" text-anchor="middle" fill="#475569">traffic.sh</text>
  <text x="115" y="215" font-size="12" text-anchor="middle" fill="#475569">GET + POST /users</text>

  <rect x="250" y="140" width="170" height="90" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="335" y="176" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Load balancer</text>
  <text x="335" y="198" font-size="12" text-anchor="middle" fill="#475569">round robin over</text>
  <text x="335" y="215" font-size="12" text-anchor="middle" fill="#475569">state/active_versions</text>

  <rect x="490" y="100" width="190" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="130" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">App v1  :8001</text>
  <text x="585" y="152" font-size="12" text-anchor="middle" fill="#1e3a8a">uses column  name</text>

  <rect x="490" y="200" width="190" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="585" y="230" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">App v2  :8002</text>
  <text x="585" y="252" font-size="12" text-anchor="middle" fill="#14532d">uses column  full_name</text>

  <rect x="760" y="140" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="860" y="176" font-size="15" font-weight="bold" text-anchor="middle" fill="#78350f">PostgreSQL 16</text>
  <text x="860" y="198" font-size="12" text-anchor="middle" fill="#78350f">database shop</text>
  <text x="860" y="215" font-size="12" text-anchor="middle" fill="#78350f">table users</text>

  <line x1="190" y1="185" x2="246" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="175" x2="486" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="195" x2="486" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="680" y1="138" x2="756" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="680" y1="232" x2="756" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="115" y="262" font-size="12" text-anchor="middle" fill="#475569">results go to logs/traffic.log,</text>
  <text x="115" y="279" font-size="12" text-anchor="middle" fill="#475569">read by ./status.sh</text>
  <text x="585" y="292" font-size="12" text-anchor="middle" fill="#475569">during a rolling deploy BOTH versions run</text>

  <!-- delivery lane -->
  <rect x="20" y="330" width="960" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="38" y="356" font-size="14" font-weight="bold" fill="#475569">DELIVERY: how a schema change gets to the database  (./ci.sh)</text>

  <rect x="40" y="400" width="170" height="90" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <text x="125" y="436" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Developer</text>
  <text x="125" y="458" font-size="12" text-anchor="middle" fill="#475569">writes a migration</text>
  <text x="125" y="475" font-size="12" text-anchor="middle" fill="#475569">db/migrations/*.sql</text>

  <rect x="290" y="400" width="190" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="385" y="430" font-size="13" font-weight="bold" text-anchor="middle" fill="#4c1d95">Stage 1: lint</text>
  <text x="385" y="452" font-size="15" font-weight="bold" text-anchor="middle" fill="#4c1d95">squawk</text>
  <text x="385" y="474" font-size="12" text-anchor="middle" fill="#4c1d95">is this change safe?</text>

  <rect x="560" y="400" width="190" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="655" y="430" font-size="13" font-weight="bold" text-anchor="middle" fill="#0c4a6e">Stage 2: deploy</text>
  <text x="655" y="452" font-size="15" font-weight="bold" text-anchor="middle" fill="#0c4a6e">dbmate up</text>
  <text x="655" y="474" font-size="12" text-anchor="middle" fill="#0c4a6e">apply pending migrations</text>

  <line x1="210" y1="445" x2="286" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="445" x2="556" y2="445" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="518" y="437" font-size="12" text-anchor="middle" fill="#15803d" font-weight="bold">pass</text>
  <path d="M750,445 L860,445 L860,234" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="850" y="385" font-size="12" text-anchor="end" fill="#475569">changes the schema</text>
  <path d="M385,490 L385,540 L125,540 L125,494" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="255" y="560" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="bold">blocked: the unsafe migration never reaches the database</text>
</svg>
